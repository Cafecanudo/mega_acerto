pre-commit:
  piped: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,json,md,yml,yaml,css,html}'
      run: corepack pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,tsx,js,mjs}'
      run: corepack pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}

    - name: typecheck
      glob: '*.{ts,tsx}'
      run: corepack pnpm -r typecheck
