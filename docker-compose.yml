name: mega-acerto

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mega_acerto
      POSTGRES_USER: mega
      POSTGRES_PASSWORD: mega
    ports:
      - '${DB_PORTA_HOST:-5442}:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mega -d mega_acerto']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
